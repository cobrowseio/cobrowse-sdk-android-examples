name: Update Cobrowse.io SDK and commit the changes

on: workflow_dispatch

concurrency:
  group: job-update-packages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.COBROWSE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COBROWSE_BOT_KEY }}
          permission-contents: write

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Find the latest SDK version and update build.gradle files
        env:
          FILES_TO_UPDATE: build.gradle sample/build.gradle standalone/build.gradle sample-core/build.gradle sample-compose/build.gradle
        run: |
          COBROWSE_VERSION=$(wget -O - -o /dev/null https://raw.githubusercontent.com/cobrowseio/cobrowse-sdk-android-binary/master/io/cobrowse/cobrowse-sdk-android/maven-metadata.xml | grep -Po '(?<=<version>)([0-9\.]+(-SNAPSHOT)?)' | sort --version-sort -r| head -n 1)
          # The SDK, its Compose UI library and its Gradle plugin are released together
          for FILE in $FILES_TO_UPDATE; do
            sed -i -E "s/(io\.cobrowse:cobrowse-sdk-android(-compose-ui|-gradle-plugin)?:).*/\1${COBROWSE_VERSION}'/" $FILE
          done

      # If the SDK was updated, commit the changes
      - name: Commit the changes
        env:
          FILES_TO_COMMIT: build.gradle sample/build.gradle standalone/build.gradle sample-core/build.gradle sample-compose/build.gradle
        run: |
          if [[ `git status --porcelain $FILES_TO_COMMIT` ]]; then
            git add $FILES_TO_COMMIT
            git commit -m "feat: update Cobrowse.io SDK"
            git push
          else
            echo "No changes to commit"
          fi
